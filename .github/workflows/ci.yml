name: CI

# 测试在 Linux 上跑。
# 客户端：main 上改了客户端时发布测试版；手动推送 vX.Y.Z 标签时发布正式版。
# vX.Y.Z-dev.N 是本流程创建的测试版标签，不再重复触发。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'push' || github.ref_type != 'tag' || !contains(github.ref_name, '-dev.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 测试
        run: dotnet test tests/DeskPal.Tests --nologo

  changes:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 决定客户端发布方式
        id: mode
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          function Set-Mode([string] $value) {
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "mode=$value`n")
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -or $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            Set-Mode 'build'
            exit 0
          }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            Set-Mode 'stable'
            exit 0
          }
          $before = '${{ github.event.before }}'
          if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^0+$') {
            Set-Mode 'beta'
            exit 0
          }
          $files = @(git diff --name-only $before $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) {
            Set-Mode 'beta'
            exit 0
          }
          $prefixes = @(
            'src/DeskPal.Client/',
            'src/DeskPal.Client.Core/',
            'src/DeskPal.Shared/',
            'installer/',
            'CHANGELOG.md',
            '.github/workflows/ci.yml'
          )
          $changed = $false
          foreach ($file in $files) {
            foreach ($prefix in $prefixes) {
              if ($file.StartsWith($prefix)) { $changed = $true }
            }
          }
          if ($changed -and $files -notcontains 'CHANGELOG.md') {
            Write-Host "::warning::这次推送改了客户端，但没有更新 CHANGELOG.md。用户更新后看不到这次的改动。"
          }
          Set-Mode $(if ($changed) { 'beta' } else { 'skip' })

  client:
    needs: [test, changes]
    if: needs.test.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.mode != 'skip'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/DeskPal.Client/web/package-lock.json

      - name: 计算版本
        id: version
        shell: pwsh
        run: |
          $mode = '${{ needs.changes.outputs.mode }}'
          $channel = 'win'
          $pre = 'false'
          if ($mode -eq 'stable') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "正式版标签必须是 vX.Y.Z：$env:GITHUB_REF_NAME" }
          } elseif ($mode -eq 'beta') {
            $latest = [version]'0.0.0'
            git tag -l 'v*' | ForEach-Object {
              if ($_ -match '^v(\d+)\.(\d+)\.(\d+)$') {
                $parsed = [version]"$($Matches[1]).$($Matches[2]).$($Matches[3])"
                if ($parsed -gt $latest) { $latest = $parsed }
              }
            }
            $patch = if ($latest.Build -lt 0) { 1 } else { $latest.Build + 1 }
            $version = "$($latest.Major).$($latest.Minor).$patch-dev.$($env:GITHUB_RUN_NUMBER)"
            $channel = 'beta'
            $pre = 'true'
          } else {
            $version = '0.0.0-ci'
          }
          if ($mode -eq 'stable' -or $mode -eq 'beta') {
            # 正式版必须一致；测试版只要求不低于，方便先把下一节改成 0.2.0 这类跨版本号再打标签。
            $base = [version](($version -split '-')[0])
            $top = Select-String -Path CHANGELOG.md -Pattern '^##\s+v?(\d+\.\d+\.\d+)' | Select-Object -First 1
            $topVersion = if ($top) { [version]$top.Matches[0].Groups[1].Value } else { $null }
            if (-not $topVersion -or $topVersion -lt $base -or ($mode -eq 'stable' -and $topVersion -ne $base)) {
              throw "CHANGELOG.md 最上面一节必须是「## $base」，这次发布的是 $version"
            }
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`nchannel=$channel`nprerelease=$pre`n")
          "mode=$mode version=$version channel=$channel"

      - name: 发布客户端
        shell: pwsh
        run: >
          dotnet publish src/DeskPal.Client -c Release -r win-x64 --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -p:DebugType=none
          -o publish/DeskPal

      - name: 打包并发布到 GitHub Release
        if: needs.changes.outputs.mode != 'build'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet tool install -g vpk --version 1.2.161
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          $version = '${{ steps.version.outputs.version }}'
          $channel = '${{ steps.version.outputs.channel }}'
          $pre = '${{ steps.version.outputs.prerelease }}' -eq 'true'
          $repo = "https://github.com/$env:GITHUB_REPOSITORY"
          vpk download github --repoUrl $repo --token $env:GH_TOKEN --channel $channel $(if ($pre) { '--pre' })
          if ($LASTEXITCODE -ne 0) {
            Write-Host "没有可做差异包的上一版，改为完整包。"
          }
          $exclude = @('--exclude', $env:GITHUB_REF_NAME)
          if (-not $pre) { $exclude += @('--exclude', '*-dev*') }
          $previous = git describe --tags --abbrev=0 @exclude HEAD 2>$null
          if ($LASTEXITCODE -ne 0) { $previous = $null } else { $previous = $previous.Trim() }
          $logArgs = @('-c', 'i18n.logOutputEncoding=utf-8', 'log', '--no-merges', '--pretty=format:%s')
          if ($previous) { $logArgs += "$previous..HEAD" }
          $subjects = @(git @logArgs | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0) { $subjects = @() }
          $limit = 40
          $more = ''
          if ($subjects.Count -gt $limit) {
            $more = "`n- 还有 $($subjects.Count - $limit) 条提交"
            $subjects = @($subjects | Select-Object -First $limit)
          }
          $changes = if ($subjects.Count -eq 0) { '- 这次没有新的提交说明' } else { ($subjects | ForEach-Object { "- $_" }) -join "`n" }
          $setupName = "DeskPal-$version-Setup.exe"
          $intro = if ($pre) {
            "测试版，供内部试用。`n`n安装 $setupName，安装时可以选择安装目录。安装之后会继续接收测试版。`n托盘菜单可以检查更新，也可以取消「加入测试版」。已下载的更新在退出时安装。"
          } else {
            "安装 $setupName，安装时可以选择安装目录。默认只接收正式版。`n要接收 main 上的测试修复，在托盘菜单勾选「加入测试版」。"
          }
          $since = if ($previous) { "自 $previous 以来" } else { "本次发布" }
          $notes = "$intro`n`n## 更新内容（$since）`n`n$changes$more`n"
          [System.IO.File]::WriteAllText("$PWD\release-notes.txt", $notes)
          vpk pack -u DeskPal -v $version -c $channel -p publish/DeskPal --packTitle DeskPal -e DeskPal.exe --runtime win-x64 --framework webview2 --releaseNotes release-notes.txt --noPortable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packedName = "DeskPal-$channel-Setup.exe"
          # installer/ChineseSimplified.isl 取自 Inno Setup 6.7.3，编译器固定同一版本。
          $innoExe = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $innoExe
          if ((Get-FileHash $innoExe -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw "Inno Setup 安装包校验失败" }
          $innoDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Start-Process $innoExe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$innoDir`"") -Wait
          $iscc = Join-Path $innoDir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "没有找到 $iscc" }
          & $iscc /Q "/DAppVersion=$version" "/DVelopackSetup=$(Join-Path $PWD "Releases\$packedName")" "/O$(Join-Path $PWD 'InstallerOutput')" installer\DeskPal.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem Releases -File | Where-Object {
            $_.Extension -eq '.nupkg' -and $_.Name -notlike "*$version*"
          } | Remove-Item -Force
          $tag = "v$version"
          $name = if ($pre) { "DeskPal $version 测试版" } else { "DeskPal $version" }
          $upload = @('upload', 'github', '--repoUrl', $repo, '--token', $env:GH_TOKEN, '--publish', '--channel', $channel, '--tag', $tag, '--releaseName', $name)
          if ($pre) { $upload += '--pre' }
          vpk @upload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 用户只下载选择目录的安装向导。Velopack 自带的 Setup.exe 已内嵌在向导里，自动更新只用 nupkg 和 releases 清单。
          gh release upload $tag (Join-Path InstallerOutput $setupName) --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release delete-asset $tag $packedName --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $pre) { exit 0 }
          $list = gh release list --limit 100 --json tagName,isPrerelease,publishedAt | ConvertFrom-Json
          $old = @($list | Where-Object { $_.isPrerelease -and $_.tagName -like '*-dev.*' } | Sort-Object publishedAt -Descending | Select-Object -Skip 8)
          foreach ($release in $old) {
            gh release delete $release.tagName --yes --cleanup-tag
          }

      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.mode != 'build'
        with:
          name: DeskPal-${{ steps.version.outputs.version }}-Setup
          path: InstallerOutput/*-Setup.exe