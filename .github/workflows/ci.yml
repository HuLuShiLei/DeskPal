name: CI

# 测试在 Linux 上跑。
# 客户端：main 上改了客户端时发布测试版；手动推送 vX.Y.Z 标签时发布正式版。
# vX.Y.Z-dev.N 是本流程创建的测试版标签，不再重复触发。
# macOS 客户端（mac 任务）和 Windows 版同一个版本号，发布到同一个 Release，按芯片分 osx-arm64、osx-x64 两个通道。
# 在其他分支上手动运行（workflow_dispatch）时只编译打包，不发布，安装包在本次运行的 Artifacts 里下载。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'push' || github.ref_type != 'tag' || !contains(github.ref_name, '-dev.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 测试
        run: dotnet test tests/DeskPal.Tests --nologo

  changes:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 决定客户端发布方式
        id: mode
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          function Set-Mode([string] $value) {
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "mode=$value`n")
          }
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request' -or $env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            Set-Mode 'build'
            exit 0
          }
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            Set-Mode 'stable'
            exit 0
          }
          $before = '${{ github.event.before }}'
          if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^0+$') {
            Set-Mode 'beta'
            exit 0
          }
          $files = @(git diff --name-only $before $env:GITHUB_SHA)
          if ($LASTEXITCODE -ne 0) {
            Set-Mode 'beta'
            exit 0
          }
          $prefixes = @(
            'src/DeskPal.Client/',
            'src/DeskPal.Client.App/',
            'src/DeskPal.Client.Mac/',
            'src/DeskPal.Client.Core/',
            'src/DeskPal.Shared/',
            'installer/',
            'CHANGELOG.md',
            '.github/workflows/ci.yml'
          )
          $changed = $false
          foreach ($file in $files) {
            foreach ($prefix in $prefixes) {
              if ($file.StartsWith($prefix)) { $changed = $true }
            }
          }
          if ($changed -and $files -notcontains 'CHANGELOG.md') {
            Write-Host "::warning::这次推送改了客户端，但没有更新 CHANGELOG.md。用户更新后看不到这次的改动。"
          }
          Set-Mode $(if ($changed) { 'beta' } else { 'skip' })

      - name: 计算版本
        id: version
        shell: pwsh
        run: |
          $mode = '${{ steps.mode.outputs.mode }}'
          $channel = 'win'
          $pre = 'false'
          if ($mode -eq 'stable') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "正式版标签必须是 vX.Y.Z：$env:GITHUB_REF_NAME" }
          } elseif ($mode -eq 'beta') {
            $latest = [version]'0.0.0'
            git tag -l 'v*' | ForEach-Object {
              if ($_ -match '^v(\d+)\.(\d+)\.(\d+)$') {
                $parsed = [version]"$($Matches[1]).$($Matches[2]).$($Matches[3])"
                if ($parsed -gt $latest) { $latest = $parsed }
              }
            }
            $patch = if ($latest.Build -lt 0) { 1 } else { $latest.Build + 1 }
            $version = "$($latest.Major).$($latest.Minor).$patch-dev.$($env:GITHUB_RUN_NUMBER)"
            $channel = 'beta'
            $pre = 'true'
          } else {
            # Velopack 打包要求版本号不低于 0.0.1（mac 任务在 PR 和手动运行时也打包）。
            $version = '0.0.1-ci'
          }
          if ($mode -eq 'stable' -or $mode -eq 'beta') {
            # 正式版必须一致；测试版只要求不低于，方便先把下一节改成 0.2.0 这类跨版本号再打标签。
            $base = [version](($version -split '-')[0])
            $top = Select-String -Path CHANGELOG.md -Pattern '^##\s+v?(\d+\.\d+\.\d+)' | Select-Object -First 1
            $topVersion = if ($top) { [version]$top.Matches[0].Groups[1].Value } else { $null }
            if (-not $topVersion -or $topVersion -lt $base -or ($mode -eq 'stable' -and $topVersion -ne $base)) {
              throw "CHANGELOG.md 最上面一节必须是「## $base」，这次发布的是 $version"
            }
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`nchannel=$channel`nprerelease=$pre`n")
          "mode=$mode version=$version channel=$channel"

  client:
    needs: [test, changes]
    if: needs.test.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.mode != 'skip'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/DeskPal.Client/web/package-lock.json

      - name: 发布客户端
        shell: pwsh
        run: >
          dotnet publish src/DeskPal.Client -c Release -r win-x64 --self-contained true
          -p:Version=${{ needs.changes.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -p:DebugType=none
          -o publish/DeskPal

      - name: 打包并发布到 GitHub Release
        if: needs.changes.outputs.mode != 'build'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          dotnet tool install -g vpk --version 1.2.161
          $env:Path = "$env:USERPROFILE\.dotnet\tools;$env:Path"
          $version = '${{ needs.changes.outputs.version }}'
          $channel = '${{ needs.changes.outputs.channel }}'
          $pre = '${{ needs.changes.outputs.prerelease }}' -eq 'true'
          $repo = "https://github.com/$env:GITHUB_REPOSITORY"
          vpk download github --repoUrl $repo --token $env:GH_TOKEN --channel $channel $(if ($pre) { '--pre' })
          if ($LASTEXITCODE -ne 0) {
            Write-Host "没有可做差异包的上一版，改为完整包。"
          }
          $exclude = @('--exclude', $env:GITHUB_REF_NAME)
          if (-not $pre) { $exclude += @('--exclude', '*-dev*') }
          $previous = git describe --tags --abbrev=0 @exclude HEAD 2>$null
          if ($LASTEXITCODE -ne 0) { $previous = $null } else { $previous = $previous.Trim() }
          $logArgs = @('-c', 'i18n.logOutputEncoding=utf-8', 'log', '--no-merges', '--pretty=format:%s')
          if ($previous) { $logArgs += "$previous..HEAD" }
          $subjects = @(git @logArgs | Where-Object { -not [string]::IsNullOrWhiteSpace($_) })
          if ($LASTEXITCODE -ne 0) { $subjects = @() }
          $limit = 40
          $more = ''
          if ($subjects.Count -gt $limit) {
            $more = "`n- 还有 $($subjects.Count - $limit) 条提交"
            $subjects = @($subjects | Select-Object -First $limit)
          }
          $changes = if ($subjects.Count -eq 0) { '- 这次没有新的提交说明' } else { ($subjects | ForEach-Object { "- $_" }) -join "`n" }
          $setupName = "DeskPal-$version-Setup.exe"
          $intro = if ($pre) {
            "本版本为测试版。安装后将继续接收测试版更新。`n`n请下载并运行 $setupName。安装时可以选择安装目录。`n`n在「设置」的「关于」中可以检查更新，或关闭「加入测试版」。已下载的更新在退出程序时安装。"
          } else {
            "本版本为正式版。安装后默认只接收正式版更新。`n`n请下载并运行 $setupName。安装时可以选择安装目录。`n`n如需接收测试版，在「设置」的「关于」中开启「加入测试版」。"
          }
          $since = if ($previous) { "自 $previous 以来" } else { "本次发布" }
          $notes = "$intro`n`n## 更新内容（$since）`n`n$changes$more`n"
          [System.IO.File]::WriteAllText("$PWD\release-notes.txt", $notes)
          vpk pack -u DeskPal -v $version -c $channel -p publish/DeskPal --packTitle DeskPal -e DeskPal.exe -i src/DeskPal.Client/Assets/DeskPal.ico --runtime win-x64 --framework webview2 --releaseNotes release-notes.txt --noPortable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packedName = "DeskPal-$channel-Setup.exe"
          # installer/ChineseSimplified.isl 取自 Inno Setup 6.7.3，编译器固定同一版本。
          $innoExe = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $innoExe
          if ((Get-FileHash $innoExe -Algorithm SHA256).Hash -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw "Inno Setup 安装包校验失败" }
          $innoDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Start-Process $innoExe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$innoDir`"") -Wait
          $iscc = Join-Path $innoDir 'ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "没有找到 $iscc" }
          & $iscc /Q "/DAppVersion=$version" "/DVelopackSetup=$(Join-Path $PWD "Releases\$packedName")" "/O$(Join-Path $PWD 'InstallerOutput')" installer\DeskPal.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem Releases -File | Where-Object {
            $_.Extension -eq '.nupkg' -and $_.Name -notlike "*$version*"
          } | Remove-Item -Force
          $tag = "v$version"
          $name = if ($pre) { "DeskPal $version 测试版" } else { "DeskPal $version" }
          $upload = @('upload', 'github', '--repoUrl', $repo, '--token', $env:GH_TOKEN, '--publish', '--channel', $channel, '--tag', $tag, '--releaseName', $name)
          if ($pre) { $upload += '--pre' }
          vpk @upload
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 用户只下载选择目录的安装向导。Velopack 自带的 Setup.exe 已内嵌在向导里，自动更新只用 nupkg 和 releases 清单。
          gh release upload $tag (Join-Path InstallerOutput $setupName) --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release delete-asset $tag $packedName --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $pre) { exit 0 }
          $list = gh release list --limit 100 --json tagName,isPrerelease,publishedAt | ConvertFrom-Json
          $old = @($list | Where-Object { $_.isPrerelease -and $_.tagName -like '*-dev.*' } | Sort-Object publishedAt -Descending | Select-Object -Skip 8)
          foreach ($release in $old) {
            gh release delete $release.tagName --yes --cleanup-tag
          }

      - uses: actions/upload-artifact@v4
        if: needs.changes.outputs.mode != 'build'
        with:
          name: DeskPal-${{ needs.changes.outputs.version }}-Setup
          path: InstallerOutput/*-Setup.exe

  # macOS 客户端。和 Windows 版共用版本号和 Release，每种芯片一个更新通道：
  #   正式版 osx-arm64、osx-x64；测试版 osx-arm64-beta、osx-x64-beta（见 UpdatePolicy.Channel）。
  # 默认给 .app 做 ad-hoc 签名，.pkg 不签名，用户第一次打开要在「系统设置 → 隐私与安全性」里允许。
  # 有 Apple Developer 账号后，把仓库变量 MAC_SIGN 设为 true，并配置下面这些 secret，就会签名并公证：
  #   MAC_CERT_P12（Developer ID Application 和 Developer ID Installer 证书导出的 .p12，base64）、MAC_CERT_PASSWORD、
  #   MAC_SIGN_APP_IDENTITY、MAC_SIGN_INSTALL_IDENTITY（证书全名）、MAC_NOTARY_APPLE_ID、MAC_NOTARY_PASSWORD（App 专用密码）、MAC_NOTARY_TEAM_ID。
  mac:
    needs: [test, changes, client]
    if: always() && needs.test.result == 'success' && needs.changes.result == 'success' && needs.changes.outputs.mode != 'skip' && (needs.client.result == 'success' || needs.changes.outputs.mode == 'build')
    runs-on: macos-15
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      MAC_SIGN: ${{ vars.MAC_SIGN }}
      # macos workload 每个版本要求一个固定的 Xcode（26.2.10233 要求 26.3），不固定时会装上要求更新 Xcode 的最新版。
      # 升级时两个一起改：workload 版本见 NuGet 包 Microsoft.NET.Sdk.macOS.Manifest-10.0.100，Xcode 要在 runner 上存在。
      XCODE_VERSION: '26.3'
      MACOS_WORKLOAD: '26.2.10233/10.0.100'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 选择 Xcode
        run: |
          xcode="/Applications/Xcode_$XCODE_VERSION.app"
          if [ ! -d "$xcode" ]; then echo "::error::runner 上没有 Xcode $XCODE_VERSION"; ls -d /Applications/Xcode*.app; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: actions/setup-dotnet@v4
        id: dotnet
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/DeskPal.Client/web/package-lock.json

      - name: 安装 macos workload
        run: |
          # runner 上还预装了更高版本的 SDK，不指定时 dotnet 会选它。global.json 只在这个任务里生成，不进仓库。
          printf '{"sdk": {"version": "%s", "rollForward": "disable"}}\n' '${{ steps.dotnet.outputs.dotnet-version }}' > global.json
          dotnet --version
          printf '{"microsoft.net.sdk.macos": "%s"}\n' "$MACOS_WORKLOAD" > "$RUNNER_TEMP/workload-rollback.json"
          dotnet workload config --update-mode manifests
          dotnet workload install macos --from-rollback-file "$RUNNER_TEMP/workload-rollback.json"
          dotnet workload list

      - name: 编译
        run: >
          dotnet build src/DeskPal.Client.Mac -c Release -r osx-${{ matrix.arch }}
          -p:Version=${{ needs.changes.outputs.version }}
          -p:IncludeSourceRevisionInInformationalVersion=false
          -o build/osx-${{ matrix.arch }}

      - name: 导入签名证书
        if: env.MAC_SIGN == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_NOTARY_APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          MAC_NOTARY_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
          MAC_NOTARY_TEAM_ID: ${{ secrets.MAC_NOTARY_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/deskpal.keychain-db"
          password=$(uuidgen)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          xcrun notarytool store-credentials deskpal --apple-id "$MAC_NOTARY_APPLE_ID" --password "$MAC_NOTARY_PASSWORD" --team-id "$MAC_NOTARY_TEAM_ID" --keychain "$keychain"

      - name: 打包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAC_SIGN_APP_IDENTITY: ${{ secrets.MAC_SIGN_APP_IDENTITY }}
          MAC_SIGN_INSTALL_IDENTITY: ${{ secrets.MAC_SIGN_INSTALL_IDENTITY }}
        run: |
          set -e
          dotnet tool install -g vpk --version 1.2.161
          export PATH="$HOME/.dotnet/tools:$PATH"
          mode='${{ needs.changes.outputs.mode }}'
          version='${{ needs.changes.outputs.version }}'
          channel="osx-${{ matrix.arch }}"
          pre=''
          if [ '${{ needs.changes.outputs.prerelease }}' = 'true' ]; then channel="$channel-beta"; pre='--pre'; fi
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          app=$(ls -d build/osx-${{ matrix.arch }}/*.app | head -1)
          if [ -z "$app" ]; then echo "::error::没有找到 .app"; ls -la build/osx-${{ matrix.arch }}; exit 1; fi
          if [ "$mode" != 'build' ]; then
            vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN" --channel "$channel" $pre || echo "没有可做差异包的上一版，改为完整包。"
          fi
          app_identity=-
          sign=()
          if [ "$MAC_SIGN" = 'true' ]; then
            app_identity="$MAC_SIGN_APP_IDENTITY"
            sign=(--signInstallIdentity "$MAC_SIGN_INSTALL_IDENTITY" --notaryProfile deskpal)
          fi
          # Velopack 在加入 UpdateMac 后签名，安装包和更新包都使用签名后的 .app。
          cp src/DeskPal.Client.Mac/Entitlements.plist "$RUNNER_TEMP/DeskPal.entitlements"
          vpk pack -u DeskPal -v "$version" -c "$channel" -p "$app" -e DeskPal --packTitle DeskPal \
            -i src/DeskPal.Client.Mac/Resources/DeskPal.icns --noPortable \
            --signAppIdentity="$app_identity" --signEntitlements "$RUNNER_TEMP/DeskPal.entitlements" "${sign[@]}"

          pkg="Releases/DeskPal-$channel-Setup.pkg"
          expanded=$(mktemp -d "$RUNNER_TEMP/deskpal-pkg.XXXXXX")/expanded
          pkgutil --expand-full "$pkg" "$expanded"
          packaged_app=$(find "$expanded" -type d -name DeskPal.app -print -quit)
          if [ -z "$packaged_app" ] || [ ! -s "$packaged_app/Contents/Resources/web/index.html" ]; then
            echo "::error::macOS 安装包缺少 DeskPal.app 或前端入口"
            exit 1
          fi
          codesign --verify --deep --strict --all-architectures "$packaged_app"
          # codesign --deep 不会检查放在 MonoBundle 中的 .NET 动态库。
          for dylib in "$packaged_app"/Contents/MonoBundle/*.dylib; do
            codesign --verify --strict --all-architectures "$dylib"
          done

          find Releases -name '*.nupkg' ! -name "*$version*" -delete
          cp "$pkg" "DeskPal-$version-osx-${{ matrix.arch }}-Setup.pkg"

      - name: 发布到 GitHub Release
        if: needs.changes.outputs.mode != 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          export PATH="$HOME/.dotnet/tools:$PATH"
          version='${{ needs.changes.outputs.version }}'
          tag="v$version"
          pre=''
          if [ '${{ needs.changes.outputs.prerelease }}' = 'true' ]; then pre='--pre'; fi
          # Windows 任务已经建好这个 Release；--merge 只追加 macOS 的更新包和清单，不改说明。
          vpk upload github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "$GH_TOKEN" --publish --merge --channel "$CHANNEL" --tag "$tag" $pre
          gh release upload "$tag" "DeskPal-$version-osx-${{ matrix.arch }}-Setup.pkg" --clobber
          gh release delete-asset "$tag" "DeskPal-$CHANNEL-Setup.pkg" --yes || true
          if [ "$MAC_SIGN" != 'true' ]; then
            notes=$(gh release view "$tag" --json body --jq .body)
            if ! printf '%s' "$notes" | grep -q 'macOS 安装包没有签名'; then
              printf '%s\n\n## macOS\n\n按芯片下载 DeskPal-%s-osx-arm64-Setup.pkg（Apple 芯片）或 osx-x64（Intel）。macOS 安装包没有签名：第一次打开时如果提示无法验证开发者，到「系统设置 → 隐私与安全性」点「仍要打开」。DeskPal 需要「辅助功能」权限读取窗口标题和浏览器网址，每次更新后可能要重新勾选。\n' "$notes" "$version" > notes.txt
              gh release edit "$tag" --notes-file notes.txt
            fi
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPal-${{ needs.changes.outputs.version }}-osx-${{ matrix.arch }}
          path: DeskPal-*-osx-*-Setup.pkg
