name: CI

# 测试在 Linux 上跑；Windows 客户端单独在 windows runner 上发布成单文件 exe。
# v* 标签额外把客户端 zip 挂到 GitHub Release。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 测试
        run: dotnet test tests/DeskPal.Tests --nologo

  client:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 发布客户端
        run: >
          dotnet publish src/DeskPal.Client -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o publish/DeskPal

      - name: 打包
        shell: pwsh
        run: Compress-Archive -Path publish/DeskPal/* -DestinationPath DeskPal-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPal-win-x64
          path: DeskPal-win-x64.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DeskPal-win-x64.zip