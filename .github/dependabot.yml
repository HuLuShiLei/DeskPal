# Dependabot version updates. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # GitHub Actions（.github/workflows）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: scope

  # .NET / NuGet（根目录 DeskPal.slnx 展开到各 csproj）
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # Microsoft / System 的主版本和小版本放进同一个 PR。
      # 只提供 net11.0 的包在工程仍是 net10.0 时不会被选中，例如服务端的 JwtBearer 和 EF。
      microsoft-dotnet:
        applies-to: version-updates
        patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      nuget-other:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - "minor"
          - "patch"
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: scope

  # 面板前端（Vite + Preact）
  - package-ecosystem: "npm"
    directory: "/src/DeskPal.Client/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: scope

  # Server 镜像基础层（deploy/Dockerfile.server）
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
      include: scope
