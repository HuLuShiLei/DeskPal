# Dependabot version updates. See:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # GitHub Actions（.github/workflows）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: scope

  # .NET / NuGet（根目录 DeskPal.slnx 展开到各 csproj）
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    labels:
      - dependencies
    # 跟 .NET 版本号走的包锁在 10。11 及以上不提 PR。
    # WebView2、Test SDK 不在这里，版本号和运行时不是一套。
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Data.Sqlite*"
        update-types: ["version-update:semver-major"]
    groups:
      # 10 的小版本和补丁仍进同一个 PR，客户端和服务端一起升。
      microsoft-dotnet:
        applies-to: version-updates
        patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - "major"
          - "minor"
          - "patch"
      nuget-other:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.*"
          - "System.*"
        update-types:
          - "minor"
          - "patch"
      nuget-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: scope

  # 面板前端（Vite + Preact）
  - package-ecosystem: "npm"
    directory: "/src/DeskPal.Client/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      npm:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: scope

  # Server 镜像基础层（deploy/Dockerfile.server）
  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # 基础镜像停在 10.0，不跟到 11.0。
    ignore:
      - dependency-name: "dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet/aspnet"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: scope
