name: 问题反馈
description: 程序无法启动、状态显示不正确，或安装、更新失败时使用。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先在「设置」中点击「检查更新」，确认问题在最新版本中仍然存在。

        Issue 对所有人公开。请勿填写密码或邀请码；截图前请遮挡其他房间成员的名称和窗口标题。

        标题用一句话概括问题，例如：检查更新时提示「检查更新失败」。

  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      description: 选择最接近的一项。
      options:
        - 无法启动或无法登录
        - 看不到房间成员，或房间成员看不到我
        - 状态或分类不正确
        - 使用统计
        - 安装或更新
        - 窗口、系统托盘或开机自启
        - 其他
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 实际结果
      description: 描述出现的问题。界面上有错误提示时，请按原文填写。
      placeholder: 在「设置」中点击「检查更新」后，提示「检查更新失败：……」。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 描述正常情况下应有的结果。
      placeholder: 提示当前已是最新版本，或开始下载新版本。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 操作步骤
      description: 按顺序列出问题出现前的操作。
      placeholder: |
        1. 启动 DeskPal 并登录
        2. 打开「设置」
        3. 点击「检查更新」
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率
      options:
        - 每次都会出现
        - 有时出现
        - 只出现过一次
        - 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 在「设置」中查看「当前版本」。程序无法启动时，填写安装包文件名中的版本号。
      placeholder: 0.1.2-dev.15
    validations:
      required: true

  - type: dropdown
    id: windows
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - 不确定
    validations:
      required: true

  - type: input
    id: username
    attributes:
      label: 用户名
      description: 用于查找服务器上的相关记录。不希望公开时可留空。
    validations:
      required: false

  - type: textarea
    id: screenshot
    attributes:
      label: 截图
      description: 可直接粘贴图片。可留空。
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        请将日志文件拖到此处上传。日志只记录进程名和状态类别，不记录窗口标题、网址、媒体标题和密码。
        日志位于安装目录下的 logs 文件夹，默认是 %LocalAppData%\Programs\DeskPal\logs；找不到时查看 %APPDATA%\DeskPal\logs。运行时问题上传 deskpal.log，安装问题上传 setup.log。没有日志时填写「无」。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 例如问题开始出现的时间、所在房间的人数、已尝试的处理方法。可留空。
    validations:
      required: false
